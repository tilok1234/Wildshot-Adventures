# CI skeleton (M0) — jobs activate as their producing milestone lands
# (planning docs/12, CI addendum). Lint/format runs no sim code, so a Linux
# runner is allowed here. Replay-hash and bot jobs (M4+) MUST run on Windows
# runners — the determinism scope is same-build/same-platform.
name: ci

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Banned-RNG grep under sim/ (CORE-32 fire-path guard)
        shell: bash
        run: |
          set -euo pipefail
          if [ -d sim ]; then
            hits=$(grep -rnE '\b(randi|randf|randfn|randi_range|randf_range|randomize|rand_from_seed|RandomNumberGenerator)\b' sim --include='*.gd' || true)
            if [ -n "$hits" ]; then
              echo "Global RNG is banned under sim/ (planning docs/12 §2.4 — named PCG32 streams only):"
              echo "$hits"
              exit 1
            fi
          fi
          echo "RNG lint clean."

      - name: GDScript format check (gdformat)
        shell: bash
        run: |
          set -euo pipefail
          # Forge packages (tileforge/, tileforge_packages/, assets/) are
          # generated build artifacts — "regenerate rather than hand-edit" —
          # so they are exempt from format. tileforge_packages/ added at the
          # sl-0083 seam: the b76 paired intake created the per-pin consumed
          # tree (byte-pinned in .gitattributes) and the exemption never grew
          # with it, leaving lint red since 2026-07-31 unnoticed.
          files=$(git ls-files '*.gd' | grep -v '^assets/' | grep -v '^tileforge/' | grep -v '^tileforge_packages/' || true)
          if [ -z "$files" ]; then
            echo "No project-authored .gd files yet — format check trivially green."
            exit 0
          fi
          pip install --quiet "gdtoolkit==4.*"
          gdformat --check $files

      # sl-0083 icon-pack raw drop: manifest contract (exists/decodes/16x16/
      # unique ids/atlas coherence) + per-file sha256s vs the intake
      # passport. Pure file reads, checkout byte-exact (assets/** -text) —
      # Linux-safe.
      - name: Icon pack validation (manifest + passport byte pin)
        shell: bash
        run: |
          set -euo pipefail
          pip install --quiet pillow
          python3 tools/validate_icon_pack.py

      # sl-0089 NPC slice roster: the manifest ships per-file sha256s
      # (assembler publish-gate provenance) — verify them + the passport's
      # manifest pin + the 480x96 / 20x4 / 24px sheet contract. Linux-safe.
      - name: NPC pack validation (manifest pins + passport)
        shell: bash
        run: |
          set -euo pipefail
          pip install --quiet pillow
          python3 tools/validate_npc_pack.py

      # sl-0093 dusk content pack (reference only): files-table + passport
      # pins, the eight designer locks, and the b77 base pairing (loud
      # refusal on drift either side). Linux-safe.
      - name: Content pack validation (pairing + locks)
        shell: bash
        run: |
          set -euo pipefail
          pip install --quiet pillow
          python3 tools/validate_content_pack.py

      # sl-0095 balance calculator (docs/22 block 9, paper-first): the five
      # ruled gates over the game-owned data file — pure stdlib math,
      # deterministic. Linux-safe.
      - name: Balance calculator (docs/22 gates)
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/balance_calc.py

  # M2 job (tracker line "determinism smoke test"): double-run state-hash
  # compare. Sim execution — §2.4 scope is same-build/same-platform (Windows),
  # so this MUST run on a Windows runner; a Linux runner would false-alarm on
  # float drift.
  determinism-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot 4.6.2 (win64)
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-4.6.2-stable-win64

      - name: Download Godot 4.6.2
        if: steps.godot-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$HOME/godot" | Out-Null
          Invoke-WebRequest -Uri https://github.com/godotengine/godot/releases/download/4.6.2-stable/Godot_v4.6.2-stable_win64.exe.zip -OutFile "$env:TEMP/godot.zip"
          Expand-Archive "$env:TEMP/godot.zip" -DestinationPath "$HOME/godot"

      - name: Determinism smoke (double-run hash compare)
        shell: pwsh
        run: |
          & "$HOME/godot/Godot_v4.6.2-stable_win64_console.exe" --headless --path . --script tests/determinism/determinism_smoke.gd
          exit $LASTEXITCODE

      # Golden-replay hash gate. CI addendum schedules this at M4; activated
      # at M3 when the goldens landed (strictly more verification, zero
      # design change) — flagged in the planning session log for veto.
      - name: Golden replays (10 consecutive verifies)
        shell: pwsh
        run: |
          & "$HOME/godot/Godot_v4.6.2-stable_win64_console.exe" --headless --path . --script tests/replay_fixtures/verify_replays.gd
          exit $LASTEXITCODE

  # M1 job (CI addendum): TileForge §4 acceptance, headless. Pure CPU image
  # compositing — no sim execution, so a Linux runner is allowed.
  pixel-match:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot 4.6.2
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-4.6.2-stable-linux-x86_64

      - name: Download Godot 4.6.2
        if: steps.godot-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/godot
          curl -sL -o /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.6.2-stable/Godot_v4.6.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v4.6.2-stable_linux.x86_64 ~/godot/godot

      - name: Pixel-match acceptance (GAME-GUIDE §4 step 1)
        run: ~/godot/godot --headless --path . --script tests/pixel_match/pixel_match.gd

      - name: net16 mask derivation (GAME-GUIDE §4 step 2 subset)
        run: ~/godot/godot --headless --path . --script tests/pixel_match/net16_masks.gd

      # M4 (docs/13 §6): UI kit pieces match their manifest. Linux-safe.
      # (The spriteforge actor-sheet slice test retired at M5 acceptance
      # with its pack — assembler sheets validate in the pack test below.)
      - name: UI kit validation
        run: ~/godot/godot --headless --path . --script tests/uikit/uikit_validate.gd

      # sl-0077 crosshair styles: doc-13 cursor contract per style x
      # size (odd, true center, kit two-color palette, 1 px rim) + the
      # ratified-default byte pin. Pure Image ops — Linux-safe.
      - name: Crosshair styles contract
        run: ~/godot/godot --headless --path . --script tests/crosshair/crosshair_styles_test.gd

      # Projectile pack + map consistency (M-FX curation; Law-2/8 hostile
      # coverage guard). Pure image reads — Linux-safe.
      - name: Projectile-pack validation
        run: ~/godot/godot --headless --path . --script tests/projectile_pack/projectile_pack_test.gd

      # WorldForge game-pack validator (docs/15 consumer-prep half):
      # synthetic fixture with hand-derived flood count + negative
      # guards. Pure JSON/bit decode — Linux-safe.
      - name: WorldForge pack validator
        run: ~/godot/godot --headless --path . --script tests/worldforge_pack/worldforge_pack_test.gd

      # sl-0065 dev-map consumer: pack minimap.png present/loadable/
      # grid-proportional for every pack-routed scenario; hide-by-
      # absence for arena scenarios. Pure JSON/PNG reads — Linux-safe.
      - name: Dev map minimap consumer
        run: ~/godot/godot --headless --path . --script tests/dev_map/dev_map_test.gd

      # docs/14: assembler-pack consumer — fixture round-trip always;
      # real-pack validation activates when the drop lands. Linux-safe.
      - name: Assembler pack consumer test
        run: ~/godot/godot --headless --path . --script tests/assembler_pack/assembler_pack_test.gd

      # M8 feedback return path: evidence scan / dev-session exclusion /
      # summary-code checksum / bundle zip. Pure jsonl+zip — Linux-safe.
      - name: Feedback bundle + summary code
        run: ~/godot/godot --headless --path . --script tests/feedback/feedback_bundle_test.gd

      # docs/22 stat frame (slice S0 seam 1): formula/curves/XP/tiers/
      # trades/cap/profile/hash contracts + the loader's negative
      # tests. Pure sim + JSON — Linux-safe.
      - name: Stat frame contracts
        run: ~/godot/godot --headless --path . --script tests/stat_frame/stat_frame_test.gd

      # docs/23 S0 living world (slice seam 2): importer census +
      # leash/respawn/tether mechanics + slice-world determinism.
      # Pack reads are byte-pinned FileAccess — Linux-safe.
      - name: Living world contracts
        run: ~/godot/godot --headless --path . --script tests/living_world/living_world_test.gd

      # S1 seam 1 (sl-0104): Green roster indexes 8..21, the roster-wide
      # pattern->lead law, variant parity vs the catalog index, the
      # green re-table + density pins. Data reads only — Linux-safe.
      - name: Green roster contracts
        run: ~/godot/godot --headless --path . --script tests/green_roster/green_roster_test.gd

      # S1 seam 5: generic quests v1 — walk-up accept/turn-in, KILL/
      # VISIT/COLLECT progress from sim events, in-sim rewards, done
      # mask, giver-slot parity vs the content pack. Linux-safe
      # (within-run sim checks only).
      - name: Quests v1 contracts
        run: ~/godot/godot --headless --path . --script tests/quests/quest_test.gd

      # S1 seam 6 (sl-0105): the patience verbs — foraging + the
      # STARHOOK cast, node consumption, the rifter mini-class
      # round-trip, slice node premises. Linux-safe.
      - name: Gather + Starhook contracts
        run: ~/godot/godot --headless --path . --script tests/gather/gather_test.gd

      # Slice S0 seam 4: consumed NPC tree (32 looks), deterministic
      # stations on real b77 ground, icon atlas ids. Linux-safe.
      - name: NPC + icon wiring
        run: ~/godot/godot --headless --path . --script tests/wiring/npc_icon_wiring_test.gd

      - name: Upload diff artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pixel-match-diff
          path: |
            tests/pixel_match/out_render.png
            tests/pixel_match/out_diff.png
          if-no-files-found: ignore
